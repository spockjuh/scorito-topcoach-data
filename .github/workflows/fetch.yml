name: Fetch Scorito TopCoach data

on:
  schedule:
    # Elke 30 min, 06:00-23:00 UTC (08:00-01:00 CEST) — het SCRIPT bepaalt zelf of
    # dit een volledige verversing wordt (wedstrijddag, of data > 7u oud) of een
    # goedkope no-op (rustige dag, data nog vers genoeg).
    - cron: "0,30 6-23 * * *"
  workflow_dispatch: {}  # handmatig te starten via de Actions-tab

permissions:
  contents: write  # nodig om wijzigingen terug te committen

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch TopCoach data
        run: python scripts/fetch_topcoach.py

      - name: Commit and push if changed
        run: |
          git config user.name "scorito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen, niks te committen."
          else
            git commit -m "Data-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
