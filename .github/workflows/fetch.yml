name: Fetch Scorito TopCoach data

on:
  schedule:
    # 06:00 UTC = 08:00 CEST (zomertijd) / 07:00 CET (wintertijd) — dagelijks
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # handmatig te starten via de Actions-tab

permissions:
  contents: write  # nodig om wijzigingen terug te committen

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch TopCoach data
        run: python scripts/fetch_topcoach.py

      - name: Commit and push if changed
        run: |
          git config user.name "scorito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen, niks te committen."
          else
            git commit -m "Data-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
